######################################################
######## Linux 64 bit, only libnexa from source deps
######################################################
.ccache-ubuntu-only-libnexa:
    extends: .ubuntu_ccache_scripts
    cache:
        <<: *ccache_settings
        key: ccache-ubuntu-only-libnexa

build-ubuntu-deps-only-libnexa:
    stage: build_depends
    extends: [.ubuntu_base, .detect-cpus]
    needs: []
    cache:
        key:
            prefix: depends-ubuntu-only-libnexa
            files:
                - depends/**/*
        paths:
            - depends/sources
            - depends/built
            - depends/x86_64-linux-gnu
    script:
        - cd depends
        - make HOST=x86_64-linux-gnu -j"$CPUS" ONLY_LIBNEXA=1
    artifacts:
        paths:
            - depends/x86_64-linux-gnu
    rules:
      - if: ($CI_PIPELINE_SOURCE != "schedule" || $EXTENDED_TESTS == "True")

build-ubuntu-only-libnexa:
    stage: build
    extends: [.ccache-ubuntu-only-libnexa, .detect-cpus]
    needs:
        - job: build-ubuntu-deps-only-libnexa
          artifacts: true
    script:
        - ./autogen.sh
        - mkdir build; cd build
        - ../configure --enable-shared --enable-debug --enable-only-libnexa --enable-glibc-back-compat --enable-reduce-exports --cache-file=config.cache --prefix=$PWD/../depends/x86_64-linux-gnu CPPFLAGS=-DDEBUG_LOCKORDER
        - make -j"$CPUS"
        - ccache --show-stats
    artifacts:
        when: always
        paths:
            - ./build/src/.libs/libnexa.*
    rules:
      - if: ($CI_PIPELINE_SOURCE != "schedule" || $EXTENDED_TESTS == "True")


######################################################
######## Linux 64 bit, source deps
######################################################
.ccache-ubuntu:
    extends: .ubuntu_ccache_scripts
    cache:
        <<: *ccache_settings
        key: ccache-ubuntu

build-ubuntu-deps:
    stage: build_depends
    extends: [.ubuntu_base, .detect-cpus]
    needs: []
    cache:
        key:
            prefix: depends-ubuntu
            files:
                - depends/**/*
        paths:
            - depends/sources
            - depends/built
            - depends/x86_64-linux-gnu
    script:
        - cd depends
        - make HOST=x86_64-linux-gnu -j$CPUS
    artifacts:
        paths:
            - depends/x86_64-linux-gnu
    rules:
      - if: ($CI_PIPELINE_SOURCE != "schedule" || $EXTENDED_TESTS == "True")

build-ubuntu:
    stage: build
    extends: [.ccache-ubuntu, .detect-cpus]
    needs:
        - job: build-ubuntu-deps
          artifacts: true
    script:
        - ./autogen.sh
        - mkdir build; cd build
        - ../configure --enable-shared --enable-debug --enable-zmq --enable-glibc-back-compat --enable-reduce-exports --cache-file=config.cache --prefix=$PWD/../depends/x86_64-linux-gnu CPPFLAGS=-DDEBUG_LOCKORDER
        - make -j"$CPUS"
        - ccache --show-stats
    after_script:
        - |
            if [ "$CI_JOB_STATUS" = "failed" ]; then
                mkdir -p build/ci-failure-logs
                find build/src/test src/test -maxdepth 1 -name '*.log' -type f -exec cp -f {} build/ci-failure-logs/ \; 2>/dev/null || true
                [ ! -f src/test-suite.log ] || cp -f src/test-suite.log build/ci-failure-logs/
            fi
    artifacts:
        when: always
        paths:
            - ./build/src/nexad
            - ./build/src/nexa-cli
            - ./build/src/test/test_nexa
            - ./build/qa/*
            - ./build/ci-failure-logs/
            - ./build/src/.libs/libnexa.*
    rules:
      - if: ($CI_PIPELINE_SOURCE != "schedule" || $EXTENDED_TESTS == "True")

build-ubuntu-rostrum:
    extends: .ubuntu_base
    stage: build
    cache:
      paths:
        # Paths from Cargo Book, section "Caching the Cargo home in CI"
        - cargohome/bin
        - cargohome/registry/index
        - cargohome/registry/cache
        - cargohome/git/db

    needs:
        - job: build-ubuntu-deps
          artifacts: true

    variables:
        CARGO_HOME: ${CI_PROJECT_DIR}/cargohome

    before_script:
      - mkdir -p cargohome
      - mkdir -p build

    script:
        # add cargo to PATH
        - export PATH=$PATH:`pwd`/depends/x86_64-linux-gnu/native/bin
        # Prepare make file
        - ./autogen.sh > /dev/null
        - cd build
        # remove cache file to see if it catch new CXX and CC env
        - ../configure --prefix=$PWD/../depends/x86_64-linux-gnu > /dev/null
        - make rostrum

    artifacts:
        paths:
            - ./build/src/rostrum
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"

build-ubuntu-tests:
    stage: build_tests
    extends: .ubuntu_base
    needs:
        - job: build-ubuntu
          artifacts: true
    cache: []
    script:
        - (cd build/src; ./test/test_nexa)
    artifacts:
        when: on_failure
        paths:
            - ./build/src/test/
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"

test-ubuntu-qa:
    stage: qa_tests
    extends: .ubuntu_base
    parallel: 2
    cache: []
    needs:
        - job: build-ubuntu
          artifacts: true
    script:
        - mkdir -p $CI_PROJECT_DIR/cores
        - mkdir -p $CI_PROJECT_DIR/saved-cores
        - |
            CORE_PATTERN="$CI_PROJECT_DIR/cores/core.%e.%p.%h.%t"
            if ! printf '%s\n' "$CORE_PATTERN" > /proc/sys/kernel/core_pattern; then
                echo "WARNING: runner does not permit configuring core dumps"
            fi
        - cd build;
        - ./qa/pull-tester/rpc-tests.py -shard="$CI_NODE_INDEX/$CI_NODE_TOTAL" --coverage --no-ipv6-rpc-listen --gitlab
    artifacts:
        when: on_failure
        paths:
            - ./qa/qa_tests/
            - $CI_PROJECT_DIR/saved-cores
            - ./build/src/nexad
            - ./build/ctorout.txt
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"

test-ubuntu-qa-extended:
    stage: qa_tests
    extends: .ubuntu_base
    cache: []
    needs:
        - job: build-ubuntu
          artifacts: true
    script:
        - mkdir -p $CI_PROJECT_DIR/cores
        - mkdir -p $CI_PROJECT_DIR/saved-cores
        - |
            CORE_PATTERN="$CI_PROJECT_DIR/cores/core.%e.%p.%h.%t"
            if ! printf '%s\n' "$CORE_PATTERN" > /proc/sys/kernel/core_pattern; then
                echo "WARNING: runner does not permit configuring core dumps"
            fi
        - cd build;
        - ./qa/pull-tester/rpc-tests.py --coverage --no-ipv6-rpc-listen --gitlab --extended-only
    artifacts:
        when: on_failure
        paths:
            - ./qa/qa_tests/
            - $CI_PROJECT_DIR/saved-cores
            - ./build/src/nexad
            - ./build/ctorout.txt
    tags:
        - scheduled
    rules:
        - if: ($CI_PIPELINE_SOURCE == "schedule" && $EXTENDED_TESTS == "True")


test-ubuntu-benchmarks:
    extends: .ubuntu_base
    stage: benchmark_tests
    needs:
        - job: build-ubuntu-nodeps
          artifacts: true
    script:
        - (./build/src/bench/bench_nexa -evals=1)
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"

test-ubuntu-qa-rostrum:
    stage: qa_tests
    image: python:latest
    needs:
        - job: build-ubuntu
          artifacts: true
        - job: build-ubuntu-rostrum
          artifacts: true
    variables:
        PIP_CACHE_DIR: $CI_PROJECT_DIR/cache-pip
    cache:
        key: rostrum-pip-$CI_NODE_INDEX
        paths:
            - cache-pip
    before_script:
        - pip install -q psutil
    script:
        - mkdir -p $CI_PROJECT_DIR/cores
        - mkdir -p $CI_PROJECT_DIR/saved-cores
        - |
            CORE_PATTERN="$CI_PROJECT_DIR/cores/core.%e.%p.%h.%t"
            if ! printf '%s\n' "$CORE_PATTERN" > /proc/sys/kernel/core_pattern; then
                echo "WARNING: runner does not permit configuring core dumps"
            fi

        - export NODE_PATH=`pwd`/build/src/nexad
        - export ROSTRUM_PATH=`pwd`/build/src/rostrum
        - wget https://gitlab.com/nexa/rostrum/-/archive/v14.0.1/rostrum-v14.0.1.tar.gz -O rostrum-master.tar.gz
        #- wget https://gitlab.com/nexa/rostrum/-/archive/master/rostrum-master.tar.gz -O rostrum-master.tar.gz
        - tar -zxf rostrum-master.tar.gz
        - python3 ci/shard-rostrum-tests.py rostrum-v14.0.1/test/functional --index "$((CI_NODE_INDEX - 1))" --count "$CI_NODE_TOTAL"
        # Keep tests within each isolated shard serial because some require exact txpool contents.
        - ./rostrum-v14.0.1/test/functional/test_runner.py --no-ipv6-rpc-listen --gitlab -parallel=1
        #- ./rostrum-master/test/functional/test_runner.py --no-ipv6-rpc-listen --gitlab
    artifacts:
        when: on_failure
        paths:
            - ./qa/qa_tests/
            - $CI_PROJECT_DIR/saved-cores
            - ./build/src/nexad
            - ./build/src/rostrum
            - ./build/ctorout.txt
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"
    parallel: 2

######################################################
######## nexad clang (no depend, only system lib installed via apt)
